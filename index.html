      <!-- Contenu indexable par les robots qui n'exécutent pas JavaScript -->
      <noscript>
        <main>
          <h1>FH6 Tracker — Communauté Forza Horizon 6</h1>
          <p>FH6 Tracker est la plateforme communautaire dédiée aux joueurs de Forza Horizon 6. Suis ta progression, gère ton garage avec plus de 600 voitures, et retrouve toute la communauté.</p>

          <h2>Feed de photos et builds</h2>
          <p>Partage tes plus belles photos Horizon Promo, explore les builds des autres joueurs, like et commente les posts de la communauté Forza Horizon 6.</p>

          <h2>Catalogue de voitures Forza Horizon 6</h2>
          <p>Accède au catalogue complet de plus de 600 voitures disponibles dans Forza Horizon 6. Filtre par classe (D, C, B, A, S1, S2, R, X), par marque, par pays d'origine ou par indice de performance (PI). Suis ta collection, ajoute des voitures à ta wishlist.</p>

          <h2>Événements et classements</h2>
          <p>Rejoins les événements organisés par la communauté, consulte le classement des joueurs les plus actifs, suis les podiums officiels et décroche des badges exclusifs.</p>

          <h2>Défis hebdomadaires</h2>
          <p>Chaque semaine, un défi autour d'une voiture spécifique de Forza Horizon 6. Poste une photo de la voiture demandée pour participer automatiquement. Le classement est publié après vérification.</p>

          <h2>Badges et progression</h2>
          <p>Gagne des badges en progressant dans ta collection, en participant à des événements et en remportant des podiums. Plus de 15 badges à débloquer.</p>
